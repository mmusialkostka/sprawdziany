<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gra „Finis Poloniae?”</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#eeece7;color:#1b1b1b;
    font:17px/1.5 Aptos,"Segoe UI",Calibri,Arial,sans-serif;padding:16px;box-sizing:border-box;text-align:center}
  .karta{max-width:440px;width:100%;background:#fff;border:1px solid #d6d2c8;border-radius:10px;padding:26px 22px}
  h1{margin:0 0 6px;font-size:22px}
  .temat{color:#666;font-size:14px;margin:0 0 14px}
  p{margin:8px 0}
  .blad{color:#a32020}
  button{font:inherit;padding:9px 18px;border-radius:6px;border:1px solid #7a1f1f;background:#7a1f1f;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
  .kolko{width:34px;height:34px;margin:6px auto 10px;border:4px solid #ddd;border-top-color:#7a1f1f;border-radius:50%;animation:k 0.9s linear infinite}
  @keyframes k{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="karta">
  <h1>Gra „Finis Poloniae?”</h1>
  <p class="temat">Upadek Rzeczypospolitej</p>
  <div id="stan"><div class="kolko"></div><p>Ładowanie…</p></div>
</div>
<script src="../../wspolne.js"></script>
<script>
(function(){
  "use strict";
  // Ta strona nie zawiera treści testu: pobiera ją ze skryptu Google (tylko przy otwartym
  // przyjmowaniu odpowiedzi i z aktualnym kodem z QR). Podgląd nauczyciela – przez panel.
  var TEST = "upadek-gra";
  var q = new URLSearchParams(location.search);
  var kod = (q.get("k") || "").trim().toUpperCase();
  var podglad = q.get("podglad") === "1";
  var stan = document.getElementById("stan");
  var licznik, proby = 0;

  function pokaz(html){ stan.innerHTML = html; }
  function wstaw(html){ document.open(); document.write(html); document.close(); }

  function pobierz(){
    clearTimeout(licznik);
    if (!window.SKRYPT){ pokaz('<p class="blad">Brak adresu skryptu.</p>'); return; }
    pokaz('<div class="kolko"></div><p>Ładowanie testu…</p>');
    fetch(window.SKRYPT + "?akcja=test&test=" + encodeURIComponent(TEST) + "&kod=" + encodeURIComponent(kod))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.ok && j.html) return wstaw(j.html);
        if (j.blad === "zamkniete"){
          pokaz('<p><b>Test jest teraz niedostępny.</b></p><p>Poczekaj, aż nauczyciel go otworzy – strona sprawdzi to sama za chwilę.</p>' +
                '<button type="button" id="ponow">Sprawdź teraz</button>');
          licznik = setTimeout(pobierz, 15000);
        } else if (j.blad === "kod"){
          pokaz('<p><b>Kod z QR jest nieaktualny.</b></p><p>Zeskanuj ponownie kod QR, który pokazuje nauczyciel.</p>');
        } else {
          pokaz('<p class="blad">Nie udało się otworzyć testu (' + (j.blad || "błąd") + ').</p><button type="button" id="ponow">Spróbuj ponownie</button>');
        }
        var b = document.getElementById("ponow"); if (b) b.onclick = pobierz;
      })
      .catch(function(){
        // przy wielu uczniach naraz skrypt Google bywa chwilowo zajęty – ponów po chwili
        proby++;
        if (proby <= 4){ pokaz('<div class="kolko"></div><p>Łączenie… (próba ' + (proby + 1) + ')</p>'); licznik = setTimeout(pobierz, 1500 * proby + Math.random() * 1500); return; }
        pokaz('<p class="blad">Brak połączenia z serwerem.</p><p>Sprawdź internet i spróbuj ponownie.</p><button type="button" id="ponow">Spróbuj ponownie</button>');
        document.getElementById("ponow").onclick = function(){ proby = 0; pobierz(); };
      });
  }

  // Podgląd: hasło przychodzi z otwartego panelu nauczyciela (okno, które otworzyło tę kartę).
  // Gdy się nie da (np. karta otwarta osobno), strona prosi o hasło.
  function pobierzPodglad(h){
    pokaz('<div class="kolko"></div><p>Ładowanie podglądu…</p>');
    fetch(window.SKRYPT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({akcja:"podglad", haslo:h, test:TEST})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.ok && j.html) return wstaw(j.html);
        if (j.blad === "haslo") return formularz("Nieprawidłowe hasło.");
        pokaz('<p class="blad">Nie udało się pobrać podglądu (' + j.blad + ').</p>');
      })
      .catch(function(){ pokaz('<p class="blad">Brak połączenia z serwerem.</p>'); });
  }
  function formularz(blad){
    pokaz('<p><b>Podgląd nauczyciela</b></p>' + (blad ? '<p class="blad">' + blad + '</p>' : '') +
      '<p><input type="password" id="haslo" placeholder="hasło do panelu" style="font:inherit;padding:8px 10px;border:1px solid #999;border-radius:6px;width:100%;box-sizing:border-box"></p>' +
      '<button type="button" id="pokaz">Pokaż podgląd</button>');
    var i = document.getElementById("haslo"); i.focus();
    var go = function(){ if (i.value) pobierzPodglad(i.value); };
    document.getElementById("pokaz").onclick = go;
    i.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  }
  function podgladNauczyciela(){
    if (!window.opener) return formularz();
    pokaz('<div class="kolko"></div><p>Ładowanie podglądu…</p>');
    var czekaj = setTimeout(function(){ formularz(); }, 3000);
    window.addEventListener("message", function odb(e){
      if (e.origin !== location.origin || !e.data || e.data.typ !== "spr-haslo") return;
      window.removeEventListener("message", odb); clearTimeout(czekaj);
      if (e.data.haslo) pobierzPodglad(e.data.haslo); else formularz();
    });
    try { window.opener.postMessage({typ:"spr-podglad", test:TEST}, location.origin); } catch (err) { formularz(); }
  }

  if (podglad) podgladNauczyciela();
  else if (!kod) pokaz('<p><b>Zeskanuj kod QR</b>, który pokazuje nauczyciel – otworzy on właściwy test.</p>');
  else pobierz();
})();
</script>
</body>
</html>
